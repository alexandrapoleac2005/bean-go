spring.application.name=bean-go

spring.datasource.url=jdbc:postgresql://localhost:5432/beango_db
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

beango.loyalty.points-for-voucher=50
beango.loyalty.max-active-vouchers=3

beango.security.jwt.secret-key=${JWT_SECRET}
beango.security.jwt.expiration=86400000

